name: AeglysAI CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore AeglysAI.sln

      - name: Build Release
        run: dotnet build AeglysAI.sln --configuration Release --no-restore

      - name: Run all tests
        run: dotnet test AeglysAI.sln --configuration Release --no-build --no-restore

  community-contracts:
    name: Community contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned evidence validator
        run: python -m pip install -r scripts/community/requirements.txt
      - name: Test community contracts
        run: python -m unittest discover -s scripts/community/tests -v
      - name: Check documentation targets
        run: python scripts/community/check_docs.py
