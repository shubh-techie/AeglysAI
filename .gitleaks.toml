title = "AegisAI secret detection (no historical exceptions)"

[extend]
useDefault = true

[[rules]]
id = "azure-servicebus-shared-access-key"
description = "Service Bus shared access credential"
regex = '''(?i)SharedAccessKey\s*=\s*([A-Za-z0-9+/]{20,}={0,2})'''
secretGroup = 1
keywords = ["SharedAccessKey"]
