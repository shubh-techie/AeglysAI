title = "AeglysAI secret detection (12 verified historical source-fingerprint exceptions)"

[extend]
useDefault = true

[[rules]]
id = "azure-servicebus-shared-access-key"
description = "Service Bus shared access credential"
regex = '''(?i)SharedAccessKey\s*=\s*([A-Za-z0-9+/]{20,}={0,2})'''
secretGroup = 1
keywords = ["SharedAccessKey"]

# Exactly twelve owner-approved immutable historical occurrences.
# Directory/staged scans and all new commits receive no exception.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Verified source fingerprint 1; immutable historical occurrence only"
condition = "AND"
commits = ["ecb96495ba9da5fbff140e864b9d4d01b8497adb"]
paths = ['''^research/results/aegisai009\-smoke/environment\.json$''']
regexTarget = "line"
regexes = ['''^[\r\n]*    "src/AegisAI\.Api/AegisAI\.Api\.csproj": "101a9f3d4ee2ddbc63eca3cac14d83f85ca8f5d012145ed2cbbe771fed448594",[\r\n]*$''']

